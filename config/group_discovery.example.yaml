# Discovery is independent from lead crawling.  When started from menu item 1,
# each candidate is validated with every account in the pool and accessible
# accounts are assigned automatically.  The direct CLI discovery command only
# stores candidates for later processing.
group_discovery:
  enabled: true
  queries:
    - "gia sư tphcm"
    - "phụ huynh tìm gia sư"
  max_results_per_query: 30
  account_ids: [fb_001]
